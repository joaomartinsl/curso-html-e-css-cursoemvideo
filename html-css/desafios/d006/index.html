<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Desafio 06</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>
        Em HTML5, podemos utilizar os elementos da lista a seguir. Passe o mouse em cima para descobrir <br>
        qual tag deverá utilizar em cada caso:
    </p>
    <p>
        <ul>
            <li><abbr title="Utilize a tag &lt;p&gt;">Parágrafo</abbr></li>
            <li><abbr title="Utilize a tag &lt;hx&gt;, podendo x ser 1 a 6 (hierarquia)">Títulos</abbr></li>
            <li><abbr title="Utilize a tag &lt;img&gt;">Imagens</abbr></li>
            <li><abbr title="Utilize a tag &lt;abbr&gt;">Abreviações</abbr></li>
            <li><abbr title="Utilize a tag &lt;code&gt;">Código-fonte</abbr></li>
            <li><abbr title="Utilize a tag &lt;ol&gt;">Listas numeradas</abbr></li>
            <li><abbr title="Utilize a tag &lt;ul&gt;">Listas com demarcadores</abbr></li>
        </ul>
    </p>
</body>
</html>
